      <text class="m" x="420" y="261" font-size="11" fill="#6E7681">Products</text><text class="m" x="552" y="261" font-size="11" fill="#7EE787">Awallet · PULSE · VORCL · AION</text>
      <text class="m" x="420" y="282" font-size="11" fill="#6E7681">Repositories</text><text class="m" x="552" y="282" font-size="11" fill="#E6EDF3">33 public</text>
      <text class="m" x="420" y="303" font-size="11" fill="#6E7681">Contributions</text><text class="m" x="552" y="303" font-size="11" fill="#E6EDF3">5,270 last year</text>
