<svg xmlns="http://www.w3.org/2000/svg" width="860" height="516" viewBox="0 0 860 516" fill="none" role="img" aria-label="Products: Awallet, PULSE, VORCL, AION">
  <title>Products: Awallet, PULSE, VORCL, AION</title>
  <defs>
    <clipPath id="p-clip"><rect x="1" y="1" width="858" height="514" rx="26"/></clipPath>
    <linearGradient id="p-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DE8DC" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2DE8DC" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="p-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FF7EE"/>
      <stop offset="100%" stop-color="#00C2B8"/>
