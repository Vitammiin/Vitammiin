<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190" viewBox="0 0 860 190" fill="none" role="img" aria-label="Highlights: 4 products shipped, 5.2K+ contributions, 20+ sub-agents">
  <title>Highlights: 4 products shipped, 5.2K+ contributions, 20+ sub-agents</title>
  <defs>
    <clipPath id="g-clip"><rect x="1" y="1" width="858" height="188" rx="26"/></clipPath>
    <linearGradient id="g-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DE8DC" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2DE8DC" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="g-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FF7EE"/>
      <stop offset="100%" stop-color="#00C2B8"/>
    </linearGradient>
    <linearGradient id="g-title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9CDD2"/>
    </linearGradient>
    <linearGradient id="g-rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DE8DC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DE8DC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2DE8DC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="g-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DE8DC" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#00C2B8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00C2B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="g-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      .t { font-family: 'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif; }
      .k { font-family: ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace; }
      @keyframes rise { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
      @keyframes breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(22px,-12px); } }
      @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-18px,14px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes scan { 0% { transform: translateX(-320px); } 100% { transform: translateX(900px); } }
      .a1 { animation: rise .7s ease-out; }
      .a2 { animation: rise .9s ease-out; }
      .a3 { animation: rise 1.1s ease-out; }
      .a4 { animation: rise 1.3s ease-out; }
      .a5 { animation: rise 1.5s ease-out; }
      .pulse { animation: breathe 3s ease-in-out infinite; }
      .fl { animation: float 20s ease-in-out infinite; }
      .fl2 { animation: float2 24s ease-in-out infinite; }
      .scan { animation: scan 9s cubic-bezier(.4,0,.2,1) infinite; }
      @media (prefers-reduced-motion: reduce) { .a1,.a2,.a3,.a4,.a5,.pulse,.fl,.fl2,.scan { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#g-clip)">
    <rect x="1" y="1" width="858" height="188" rx="26" fill="#000000"/>
    <ellipse class="fl" cx="430" cy="200" rx="420" ry="150" fill="url(#g-halo)" opacity="0.45"/>
    <g class="a1">
      <text class="t" x="40" y="52" font-size="10" font-weight="600" fill="#8E8E93" letter-spacing="2.6">PRODUCTS SHIPPED</text>
      <text class="t" x="40" y="112" font-size="46" font-weight="600" fill="url(#g-neon)" letter-spacing="-1.6" filter="url(#g-glow)">4</text>
      <text class="t" x="40" y="140" font-size="12.5" fill="#A1A1A6">live products across finance, fitness,</text>
      <text class="t" x="40" y="158" font-size="12.5" fill="#A1A1A6">AI assistants and applied AI</text>
    </g>
    <line x1="272" y1="34" x2="272" y2="162" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g class="a2">
      <text class="t" x="312" y="52" font-size="10" font-weight="600" fill="#8E8E93" letter-spacing="2.6">CONTRIBUTIONS</text>
      <text class="t" x="312" y="112" font-size="46" font-weight="600" fill="url(#g-neon)" letter-spacing="-1.6" filter="url(#g-glow)">5.2K+</text>
      <text class="t" x="312" y="140" font-size="12.5" fill="#A1A1A6">commits, reviews and pull requests</text>
      <text class="t" x="312" y="158" font-size="12.5" fill="#A1A1A6">in the last 12 months</text>
    </g>
    <line x1="544" y1="34" x2="544" y2="162" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g class="a3">
      <text class="t" x="584" y="52" font-size="10" font-weight="600" fill="#8E8E93" letter-spacing="2.6">AGENT TOOLKIT</text>
      <text class="t" x="584" y="112" font-size="46" font-weight="600" fill="url(#g-neon)" letter-spacing="-1.6" filter="url(#g-glow)">20+</text>
      <text class="t" x="584" y="140" font-size="12.5" fill="#A1A1A6">specialized sub-agents published</text>
      <text class="t" x="584" y="158" font-size="12.5" fill="#A1A1A6">on npm as agent-vorcl-flow</text>
    </g>
    <rect x="1" y="1" width="858" height="1.2" fill="url(#g-rail)" opacity="0.75"/>
  </g>
  <rect x="1" y="1" width="858" height="188" rx="26" fill="none" stroke="url(#g-hair)" stroke-width="1.1"/>
</svg>
