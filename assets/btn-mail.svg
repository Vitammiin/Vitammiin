<svg xmlns="http://www.w3.org/2000/svg" width="268" height="52" viewBox="0 0 268 52" fill="none" role="img" aria-label="Email — get in touch">
  <title>Email — get in touch</title>
  <defs>
    <clipPath id="b5-clip"><rect x="1" y="1" width="266" height="50" rx="8"/></clipPath>
    <linearGradient id="b5-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7EE787" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#3FB950" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="b5-scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EE787" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7EE787" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7EE787" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="b5-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3FB950" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3FB950" stop-opacity="0"/>
    </radialGradient>
    <filter id="b5-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .m { font-family: ui-monospace,'SF Mono','JetBrains Mono','Menlo',Consolas,'Liberation Mono',monospace; }
      @keyframes blink { 0%,45% { opacity:1; } 55%,100% { opacity:0; } }
      @keyframes breathe { 0%,100% { opacity:.45; } 50% { opacity:1; } }
      @keyframes sweep { 0% { transform: translateY(-40px); } 100% { transform: translateY(92px); } }
      @keyframes fade { from { opacity:0; } to { opacity:1; } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .live { animation: breathe 2.4s ease-in-out infinite; }
      .scan { animation: sweep 7s linear infinite; }
      .in { animation: fade .9s ease-out; }
      @media (prefers-reduced-motion: reduce) { .cursor,.live,.scan,.in { animation: none; } }
    </style>
  </defs>  <g clip-path="url(#b5-clip)">
    <rect x="1" y="1" width="266" height="50" rx="8" fill="#010409"/>
    <ellipse cx="30" cy="26" rx="60" ry="34" fill="url(#b5-halo)"/>
    <text class="m" x="16" y="30" font-size="12" fill="#3FB950">$</text>
    <text class="m" x="32" y="22" font-size="12.5" font-weight="600" fill="#E6EDF3">Email</text>
    <text class="m" x="32" y="38" font-size="10" fill="#6E7681">get in touch</text>
    <path d="M234 21 L244 21 L244 31 M244 21 L232 33" stroke="#7EE787" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="live" cx="222" cy="26" r="2.5" fill="#3FB950"/>
  </g>
  <rect x="1" y="1" width="266" height="50" rx="8" fill="none" stroke="url(#b5-edge)" stroke-width="1.2"/>
</svg>
