<svg xmlns="http://www.w3.org/2000/svg" width="268" height="62" viewBox="0 0 268 62" fill="none" role="img" aria-label="Email — get in touch">
  <title>Email — get in touch</title>
  <defs>
    <clipPath id="b5-clip"><rect x="1" y="1" width="266" height="60" rx="18"/></clipPath>
    <linearGradient id="b5-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DE8DC" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2DE8DC" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="b5-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FF7EE"/>
      <stop offset="100%" stop-color="#00C2B8"/>
    </linearGradient>
    <linearGradient id="b5-title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9CDD2"/>
    </linearGradient>
    <linearGradient id="b5-rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DE8DC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DE8DC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2DE8DC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="b5-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DE8DC" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#00C2B8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00C2B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="b5-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="b5-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      .t { font-family: 'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif; }
      @keyframes breathe { 0%,100% { opacity:.5; } 50% { opacity:1; } }
      @keyframes scan { 0% { transform: translateX(-140px); } 100% { transform: translateX(268px); } }
      .pulse { animation: breathe 3s ease-in-out infinite; }
      .scan { animation: scan 6s cubic-bezier(.45,0,.25,1) infinite; }
      @media (prefers-reduced-motion: reduce) { .pulse,.scan { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#b5-clip)">
    <rect x="1" y="1" width="266" height="60" rx="18" fill="#0A0B0D"/>
    <ellipse cx="34" cy="31" rx="46" ry="34" fill="url(#b5-halo)"/>
    <rect class="scan" x="0" y="0" width="140" height="62" fill="url(#b5-rail)" opacity="0.07"/>
    <path d="M20 1.2h228" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle class="pulse" cx="30" cy="31" r="4" fill="#2DE8DC" filter="url(#b5-glow)"/>
    <text class="t" x="50" y="27" font-size="14.5" font-weight="600" fill="#F5F5F7" letter-spacing="-0.2">Email</text>
    <text class="t" x="50" y="45" font-size="11.5" fill="#8E8E93">get in touch</text>
    <path d="M230 25 L240 25 L240 35 M240 25 L228 37" stroke="#2DE8DC" stroke-opacity="0.8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="1" y="1" width="266" height="60" rx="18" fill="none" stroke="url(#b5-hair)" stroke-width="1.1"/>
</svg>
