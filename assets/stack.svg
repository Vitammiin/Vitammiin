<svg xmlns="http://www.w3.org/2000/svg" width="860" height="312" viewBox="0 0 860 312" fill="none" role="img" aria-label="Stack: AI and agents, web, mobile, data and infrastructure">
  <title>Stack: AI and agents, web, mobile, data and infrastructure</title>
  <defs>
    <clipPath id="s-clip"><rect x="1" y="1" width="858" height="310" rx="26"/></clipPath>
    <linearGradient id="s-hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DE8DC" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2DE8DC" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="s-neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7FF7EE"/>
      <stop offset="100%" stop-color="#00C2B8"/>
    </linearGradient>
    <linearGradient id="s-title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9CDD2"/>
    </linearGradient>
    <linearGradient id="s-rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2DE8DC" stop-opacity="0"/>
      <stop offset="50%" stop-color="#2DE8DC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2DE8DC" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="s-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2DE8DC" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#00C2B8" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00C2B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="s-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="s-soft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      .t { font-family: 'SF Pro Display','SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Inter,Arial,sans-serif; }
      .k { font-family: ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace; }
      @keyframes rise { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
      @keyframes breathe { 0%,100% { opacity:.55; } 50% { opacity:1; } }
      @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(22px,-12px); } }
      @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-18px,14px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes scan { 0% { transform: translateX(-320px); } 100% { transform: translateX(900px); } }
      .a1 { animation: rise .7s ease-out; }
      .a2 { animation: rise .9s ease-out; }
      .a3 { animation: rise 1.1s ease-out; }
      .a4 { animation: rise 1.3s ease-out; }
      .a5 { animation: rise 1.5s ease-out; }
      .pulse { animation: breathe 3s ease-in-out infinite; }
      .fl { animation: float 20s ease-in-out infinite; }
      .fl2 { animation: float2 24s ease-in-out infinite; }
      .scan { animation: scan 9s cubic-bezier(.4,0,.2,1) infinite; }
      @media (prefers-reduced-motion: reduce) { .a1,.a2,.a3,.a4,.a5,.pulse,.fl,.fl2,.scan { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#s-clip)">
    <rect x="1" y="1" width="858" height="310" rx="26" fill="#000000"/>
    <ellipse class="fl" cx="60" cy="40" rx="300" ry="180" fill="url(#s-halo)" opacity="0.5"/>
    <text class="t" x="40" y="50" font-size="11" font-weight="600" fill="#2DE8DC" letter-spacing="3.4">STACK</text>
    <text class="t" x="820" y="50" text-anchor="end" font-size="11.5" fill="#8E8E93">daily drivers</text>
    <line x1="40" y1="68" x2="820" y2="68" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g class="a1">
      <circle class="pulse" cx="40" cy="96" r="2.5" fill="#2DE8DC"/>
      <text class="t" x="54" y="100" font-size="13.5" font-weight="500" fill="#F5F5F7" letter-spacing="-0.2">AI &amp; Agents</text>
      <rect x="190" y="84" width="102" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="241" y="101" text-anchor="middle" font-size="11.5" fill="#A1A1A6">Claude Code</text><rect x="301" y="84" width="102" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="352" y="101" text-anchor="middle" font-size="11.5" fill="#A1A1A6">MCP servers</text><rect x="412" y="84" width="198" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="511" y="101" text-anchor="middle" font-size="11.5" fill="#A1A1A6">Multi-agent orchestration</text><rect x="619" y="84" width="102" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="670" y="101" text-anchor="middle" font-size="11.5" fill="#A1A1A6">LLM tooling</text>
    </g>
    <g class="a2">
      <circle class="pulse" cx="40" cy="148" r="2.5" fill="#2DE8DC"/>
      <text class="t" x="54" y="152" font-size="13.5" font-weight="500" fill="#F5F5F7" letter-spacing="-0.2">Web</text>
      <rect x="190" y="136" width="81" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="231" y="153" text-anchor="middle" font-size="11.5" fill="#A1A1A6">React 19</text><rect x="280" y="136" width="74" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="317" y="153" text-anchor="middle" font-size="11.5" fill="#A1A1A6">Next.js</text><rect x="364" y="136" width="95" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="411" y="153" text-anchor="middle" font-size="11.5" fill="#A1A1A6">TypeScript</text><rect x="468" y="136" width="81" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="508" y="153" text-anchor="middle" font-size="11.5" fill="#A1A1A6">Tailwind</text>
    </g>
    <g class="a3">
      <circle class="pulse" cx="40" cy="200" r="2.5" fill="#2DE8DC"/>
      <text class="t" x="54" y="204" font-size="13.5" font-weight="500" fill="#F5F5F7" letter-spacing="-0.2">Mobile</text>
      <rect x="190" y="188" width="109" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="244" y="205" text-anchor="middle" font-size="11.5" fill="#A1A1A6">React Native</text><rect x="308" y="188" width="54" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="335" y="205" text-anchor="middle" font-size="11.5" fill="#A1A1A6">Expo</text><rect x="370" y="188" width="47" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="394" y="205" text-anchor="middle" font-size="11.5" fill="#A1A1A6">EAS</text>
    </g>
    <g class="a4">
      <circle class="pulse" cx="40" cy="252" r="2.5" fill="#2DE8DC"/>
      <text class="t" x="54" y="256" font-size="13.5" font-weight="500" fill="#F5F5F7" letter-spacing="-0.2">Data &amp; Infra</text>
      <rect x="190" y="240" width="74" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="227" y="257" text-anchor="middle" font-size="11.5" fill="#A1A1A6">Node.js</text><rect x="273" y="240" width="74" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="310" y="257" text-anchor="middle" font-size="11.5" fill="#A1A1A6">Fastify</text><rect x="357" y="240" width="95" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="404" y="257" text-anchor="middle" font-size="11.5" fill="#A1A1A6">PostgreSQL</text><rect x="461" y="240" width="74" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="498" y="257" text-anchor="middle" font-size="11.5" fill="#A1A1A6">MongoDB</text><rect x="544" y="240" width="60" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="574" y="257" text-anchor="middle" font-size="11.5" fill="#A1A1A6">Redis</text><rect x="613" y="240" width="67" height="26" rx="13" fill="#0B0D10" stroke="#FFFFFF" stroke-opacity="0.10"/><text class="t" x="647" y="257" text-anchor="middle" font-size="11.5" fill="#A1A1A6">Docker</text>
    </g>
    <rect x="1" y="1" width="858" height="1.2" fill="url(#s-rail)" opacity="0.75"/>
  </g>
  <rect x="1" y="1" width="858" height="310" rx="26" fill="none" stroke="url(#s-hair)" stroke-width="1.1"/>
</svg>
